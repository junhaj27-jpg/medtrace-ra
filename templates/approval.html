{% extends 'base.html' %}
{% block content %}
<section class="heading"><div><h1>{{ title }}</h1><p>승인 후에는 변경 요청의 수정과 삭제가 잠깁니다.</p></div></section>
<div class="panel">
  <h2>{{ change.title }}</h2>
  <p><b>변경 사유</b><br>{{ change.reason }}</p>
  <p><b>영향 범위</b><br>{{ change.impact|default:"-" }}</p>
</div>
<form method="post" class="panel form-grid">{% csrf_token %}{{ form.as_div }}
  <div class="actions"><a class="button" href="{% url 'object_list' 'changes' %}">취소</a><button class="primary">전자서명 후 승인</button></div>
</form>
{% endblock %}
