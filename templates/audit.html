{% extends 'base.html' %}{% block content %}<h1>감사 로그</h1><div class="panel"><table><tr><th>사용자</th><th>행위</th><th>경로</th><th>결과</th><th>변경 요청 값</th><th>시각</th></tr>{% for x in items %}<tr><td>{{ x.user|default:"탈퇴 사용자" }}</td><td>{{ x.method }}</td><td>{{ x.path }}</td><td>{{ x.response_status|default:"-" }}</td><td>{% if x.details %}<details><summary>보기</summary><pre>{{ x.details }}</pre></details>{% else %}-{% endif %}</td><td>{{ x.created_at }}</td></tr>{% endfor %}</table></div>{% endblock %}
